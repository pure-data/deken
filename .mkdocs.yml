site_name: deken
repo_url: https://github.com/pure-data/deken
theme:
  name: readthedocs
  highlightjs: true
plugins:
  - search
#  - mkdocstrings:
#      handlers:
#        # See: https://mkdocstrings.github.io/python/usage/
#        python:
#          paths: [src]
#          options:
#            docstring_style: sphinx
markdown_extensions:
  - markdown_include.include:
      base_path: docs
  - admonition
nav:
  - index.md
  - trust.md
  - Integrations:
    - Pure Data: plugin.md
    - Commandline: cmdline.md
    - Webpage: webpage.md
  - Packaging:
    - packaging.md
    - best-practice.md
  - Specifications:
    - file-format.md
    - arch-specifiers.md
    - object-list.md
